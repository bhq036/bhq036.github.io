<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking - Turtle Lash Studio</title>
    <link rel="stylesheet" href="Untitled-1.css">
</head>
<body>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#service">Our Services</a></li>
            <li><a href="#team">Our Team</a></li>
            <li><a href="#contact">Contact Us</a></li>
            <li><a href="booking.html">Book Now</a></li>
        </ul>
    </nav>

    <div class="booking-container">
        <h1>Book Your Appointment</h1>
        <form action="mailto:tramphb747@gmail.com" method="post" enctype="text/plain" class="booking-form">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date" min="2024-11-30" required>

            <label for="time">Preferred Time:</label>
            <select id="time" name="time" required>
                <option value="">Please choose</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="14:00">2:00 PM</option>
                <option value="18:00">6:00 PM</option>
            </select>

            <label for="service">Service Type:</label>
            <select id="service" name="service" required>
                <option value="">Please choose</option>
                <option value="Classic- Full set, 55€">Classic- Full set, 55€</option>
                <option value="Classic- Re-fill, 50€">Classic- Re-fill, 50€</option>
                <option value="Hybrid- Full set, 65€">Hybrid- Full set, 65€</option>
                <option value="Hybrid- Re-fill, 60€">Hybrid- Re-fill, 60€</option>
                <option value="Volume- Full set, 70€">Volume- Full set, 70€</option>
                <option value="Volume- Re-fill, 65€">Volume- Re-fill, 65€</option>
                <option value="Removal, 20€">Removal, 20€</option>
            </select>

            <label for="technician">Choose Technician:</label>
            <select id="technician" name="technician" required>
                <option value="">Please choose</option>
                <option value="Miley">Miley</option>
                <option value="Sofia">Sofia</option>
                <option value="Annie">Annie</option>
            </select>

            <button type="submit">Book Now</button>
        </form>
    </div>

    <footer>
        <h1>MAKE YOUR LASH PERFECT!</h1>
    </footer>

<script>
    document.getElementById("date").addEventListener("change", function() {
        const selectedDate = new Date(this.value);
        
        if (isNaN(selectedDate.getTime())) {
            alert("Please select a valid date.");
            this.value = ""; 
        } else if (selectedDate.getDay() === 0) {
            alert("We are closed on Sunday!");
            this.value = ""; 
        }
    });
</script>

</body>
</html>
